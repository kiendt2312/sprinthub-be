# Spike config — mirrors the planned prod settings, values to be confirmed by measurement.
# Redis does not support trailing comments: keep every comment on its own line.
appendonly yes
# Task 4.2 compares everysec with "always".
appendfsync everysec
# Verify support on the pinned version (task 1.4).
aof-timestamp-enabled yes
aof-load-truncated yes
save 900 1
maxmemory 256mb
maxmemory-policy noeviction
