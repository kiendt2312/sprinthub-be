# SprintHub local Redis persistence.
# Redis does not support trailing comments: keep every comment on its own line.
appendonly yes
# Flush AOF before replying to acknowledged writes, including during rewrite.
appendfsync always
no-appendfsync-on-rewrite no
# Verify support on the pinned version (task 1.4).
aof-timestamp-enabled yes
aof-load-truncated yes
save 900 1
maxmemory 512mb
maxmemory-policy noeviction
