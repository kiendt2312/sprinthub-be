x-local-node: &local-node
  image: node:24-bookworm-slim
  working_dir: /app
  init: true
  volumes:
    - ./dist:/app/dist:ro
    - ./node_modules:/app/node_modules:ro
    - ./package.json:/app/package.json:ro

services:
  redis:
    image: redis:8.10.3@sha256:1f88291b4c57bdf249f02eb085a8669889b2d2954e91d4de5118a5da6b78dd53
    entrypoint: ["sh", "/etc/sprinthub/local-redis.sh"]
    environment:
      REDIS_APP_PASSWORD: ${REDIS_APP_PASSWORD:?Run make local-env}
      REDIS_WORKER_PASSWORD: ${REDIS_WORKER_PASSWORD:?Run make local-env}
      REDIS_MAINT_PASSWORD: ${REDIS_MAINT_PASSWORD:?Run make local-env}
      REDIS_KEY_PREFIX: ${REDIS_KEY_PREFIX:-sh:v1:}
    ports:
      - "127.0.0.1:${REDIS_PORT:-16390}:6379"
    volumes:
      - ./redis/redis.conf:/etc/sprinthub/redis.conf:ro
      - ./redis/local-redis.sh:/etc/sprinthub/local-redis.sh:ro
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_MAINT_PASSWORD redis-cli --no-auth-warning --user sh-maint ping | grep -qx PONG"]
      interval: 1s
      timeout: 1s
      retries: 20

  loader:
    <<: *local-node
    profiles: [runtime]
    command: ["node", "dist/scripts/load-library.js"]
    volumes:
      - ./dist:/app/dist:ro
      - ./node_modules:/app/node_modules:ro
      - ./package.json:/app/package.json:ro
      - ./redis/functions:/app/redis/functions:ro
    environment:
      REDIS_MAINT_URL: redis://sh-maint:${REDIS_MAINT_PASSWORD}@redis:6379
      REDIS_KEY_PREFIX: ${REDIS_KEY_PREFIX:-sh:v1:}
    depends_on:
      redis:
        condition: service_healthy

  api:
    <<: *local-node
    profiles: [runtime]
    command: ["node", "dist/src/api/main.js"]
    ports:
      - "127.0.0.1:${API_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 1s
      timeout: 2s
      retries: 15
    environment:
      API_HOST: "0.0.0.0"
      AUTH_ORIGIN: ${AUTH_ORIGIN:-http://localhost:3000}
      AUTH_IP_HMAC_SECRET: ${AUTH_IP_HMAC_SECRET:?Run make local-env}
      AUTH_TRUSTED_PROXIES: ${AUTH_TRUSTED_PROXIES:-}
      AUTH_SESSION_TOUCH_MS: ${AUTH_SESSION_TOUCH_MS:-600000}
      REDIS_APP_URL: redis://sh-app:${REDIS_APP_PASSWORD}@redis:6379
      REDIS_KEY_PREFIX: ${REDIS_KEY_PREFIX:-sh:v1:}
      REDIS_TIMEOUT_MS: ${REDIS_TIMEOUT_MS:-200}
    depends_on:
      loader:
        condition: service_completed_successfully

  worker:
    <<: *local-node
    profiles: [runtime]
    command: ["node", "dist/src/worker/main.js"]
    environment:
      REDIS_WORKER_URL: redis://sh-worker:${REDIS_WORKER_PASSWORD}@redis:6379
      UNASSIGN_BATCH_SIZE: ${UNASSIGN_BATCH_SIZE-32}
      REDIS_KEY_PREFIX: ${REDIS_KEY_PREFIX:-sh:v1:}
      REDIS_TIMEOUT_MS: ${REDIS_TIMEOUT_MS:-200}
    depends_on:
      loader:
        condition: service_completed_successfully

volumes:
  redis-data:
